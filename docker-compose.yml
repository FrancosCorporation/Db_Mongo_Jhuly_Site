services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/db_mongo_jhuly_site
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
